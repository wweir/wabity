  </text>

  <rect x="108" y="112" width="132" height="132" rx="30" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="480" y="112" width="132" height="132" rx="30" fill="url(#panel)" filter="url(#shadow)"/>

  <path d="M291 177h116" stroke="url(#arrow)" stroke-width="18" stroke-linecap="round"/>
  <path d="M394 150l46 27-46 27" fill="none" stroke="#2f6b43" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="52" y="294" width="616" height="86" rx="24" fill="#ffffff" fill-opacity="0.72" stroke="#d9e6db" stroke-width="1.5"/>
  <rect x="72" y="314" width="112" height="28" rx="14" fill="#e8f1e7"/>
  <text x="93" y="333" fill="#2d5a3f" font-size="14" font-family="Helvetica Neue, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-weight="700">
