  </defs>

  <rect width="720" height="420" rx="26" fill="url(#bg)"/>
  <circle cx="74" cy="54" r="118" fill="#f0d8a9" fill-opacity="0.24"/>
  <circle cx="680" cy="32" r="90" fill="#b8d5be" fill-opacity="0.36"/>
  <circle cx="690" cy="368" r="132" fill="#bdd9c2" fill-opacity="0.24"/>

