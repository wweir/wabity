[package]
name = "Wabity"
version = "0.1.0"
description = "A desktop launcher focused on input to action workflows"
authors = ["wweir"]
edition = "2021"

[workspace]
members = ["crates/openai-compatible"]
resolver = "2"

[lib]
name = "wabity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
agent-client-protocol = "0.10.4"
anyhow = "1"
arboard = "3"
async-trait = "0.1"
axum = { version = "0.8.6", features = ["http1", "json", "tokio"] }
arrow-array = "57.2"
arrow-schema = "57.2"
base64 = "0.22"
dirs = "5"
enigo = "0.3"
futures = "0.3"
fuzzy-matcher = "0.3.7"
globset = "0.4.18"
ignore = "0.4.25"
libc = "0.2"
lancedb = "0.26.2"
lopdf = { version = "0.38", default-features = false }
md5 = "0.7"
notify = "8.2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
sysinfo = "0.38.4"
wabity-openai-compatible = { path = "crates/openai-compatible" }
text-splitter = { version = "0.29.3", features = ["markdown"] }
toml = "0.8"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.12"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-core-graphics = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-vision = "0.3.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
