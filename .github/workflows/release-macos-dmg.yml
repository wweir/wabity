name: Release macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos-dmg:
    runs-on: macos-latest
    env:
      CI: "true"
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Setup protoc
        run: brew install protobuf

      - name: Validate tag matches application version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -e "const fs = require('fs'); const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')); process.stdout.write(config.version);")"
          CARGO_VERSION="$(sed -n 's/^version = \"\\([^\"]*\\)\"$/\\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$TAURI_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match src-tauri/tauri.conf.json version $TAURI_VERSION" >&2
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match src-tauri/Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS DMG bundle
        run: npm run tauri:build:macos:dmg

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/dmg/*.dmg
